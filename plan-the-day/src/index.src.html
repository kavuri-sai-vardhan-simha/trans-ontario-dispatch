<title>Trans Ontario Plan the Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dispatch console — routes & tools left, live map centre, decision detail right; stacks on phones. */
:root{
  --bg:#F2F2F2; --surface:#FFFFFF; --surface2:#F7F8FB; --ink:#030718; --muted:#596079; --line:#DDE1EA;
  --accent:#1F4AEE; --accent-ink:#FFFFFF; --accent-soft:#E7ECFE;
  --crit:#C42638; --crit-soft:#FDECEE; --warn:#A86200; --warn-soft:#FFF3E0; --ok:#17804F; --ok-soft:#E5F5EC;
  --water:#D5E0F5; --land:#FAFBFD; --lake-line:#B9C8EA; --label:#8A92A8;
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#030718; --surface:#0A1023; --surface2:#0E1530; --ink:#ECEFF8; --muted:#98A1BC; --line:#1C2542;
  --accent:#6382FF; --accent-ink:#030718; --accent-soft:#16214D;
  --crit:#FF6B7B; --crit-soft:#3A1220; --warn:#F3A845; --warn-soft:#33240C; --ok:#45CF8D; --ok-soft:#0E2E20;
  --water:#0D1A3E; --land:#060C1E; --lake-line:#1E2F63; --label:#5E6886; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#030718; --surface:#0A1023; --surface2:#0E1530; --ink:#ECEFF8; --muted:#98A1BC; --line:#1C2542;
  --accent:#6382FF; --accent-ink:#030718; --accent-soft:#16214D;
  --crit:#FF6B7B; --crit-soft:#3A1220; --warn:#F3A845; --warn-soft:#33240C; --ok:#45CF8D; --ok-soft:#0E2E20;
  --water:#0D1A3E; --land:#060C1E; --lake-line:#1E2F63; --label:#5E6886; color-scheme:dark;}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13px;line-height:1.45}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%;min-height:0}
/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:26px;width:auto}
:root[data-theme="dark"] .brand img{filter:brightness(1.7) saturate(.9)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand img{filter:brightness(1.7) saturate(.9)}}
.prod{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;border-left:1px solid var(--line);padding-left:12px}
.prod small{font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.ctl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
select,input[type=number],input[type=text]{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.small{padding:3px 8px;font-size:11px}
.spacer{flex:1}
.status{font-size:11px;color:var(--muted)}
/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--surface);padding:9px 12px 10px;min-width:0}
.kpi .lab{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .cmp{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.good{color:var(--ok)} .bad{color:var(--crit)}
/* main grid */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:330px minmax(0,1fr) 400px}
.side,.detail{background:var(--surface);min-height:0;display:flex;flex-direction:column}
.side{border-right:1px solid var(--line)} .detail{border-left:1px solid var(--line);overflow:auto}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 2px 9px;font-weight:600;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--f-data);font-size:10px;background:var(--crit-soft);color:var(--crit);border-radius:9px;padding:0 5px;margin-left:3px}
.pane{flex:1;overflow:auto;min-height:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
/* route rows */
.rsearch{padding:10px 14px 0}
.rsearch input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface,#fff);color:inherit;font:inherit;font-size:13px}
.rrow[hidden]{display:none}
.rrow{display:grid;grid-template-columns:4px 1fr auto;gap:10px;padding:8px 14px 8px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.rrow:hover{background:var(--surface2)} .rrow.sel{background:var(--accent-soft)}
.rrow .sw{align-self:stretch;border-radius:0 2px 2px 0}
.rrow .t1{font-weight:600;display:flex;gap:6px;align-items:center;min-width:0}
.rrow .t2{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;border-radius:3px;padding:1px 5px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.chip.P{color:var(--accent);border-color:var(--accent)} .chip.D{background:var(--ink);color:var(--bg);border-color:var(--ink)} .chip.X{background:var(--warn);color:var(--surface);border-color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent} .chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent} .chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.bars{display:grid;gap:3px;width:74px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.hi{background:var(--warn)}
.rmeta{font-size:10.5px;color:var(--muted);text-align:right;font-family:var(--f-data)}
/* issues */
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.issue{display:grid;grid-template-columns:3px 1fr;gap:10px;padding:9px 14px 9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.issue:hover{background:var(--surface2)}
.issue .stripe{border-radius:0 2px 2px 0}
.issue.crit .stripe{background:var(--crit)} .issue.warn .stripe{background:var(--warn)} .issue.info .stripe{background:var(--accent)}
.issue b{font-weight:600}
.issue .sub{font-size:11px;color:var(--muted)}
/* forms */
.card>*{min-width:0}
select{max-width:100%;text-overflow:ellipsis}
.card{min-width:0;margin:12px 14px;border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--surface)}
.card h4{margin:0;font-size:13px;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:11.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.row select{flex:1}
.fld{display:grid;gap:3px;font-size:11px;color:var(--muted)}
.fld input,.fld select{width:100%}
table.t input{width:72px;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* map */
.mapwrap{position:relative;min-height:0;background:var(--land);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.maptools{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.timebar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px}
.timebar input{flex:1;accent-color:var(--accent)}
.timebar .clock{font-family:var(--f-data);font-weight:500;font-size:14px;min-width:46px}
.legend{position:absolute;top:12px;right:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:10.5px;color:var(--muted);display:grid;gap:4px}
.legend span{display:flex;align-items:center;gap:6px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:4px;padding:6px 8px;font-size:11px;max-width:260px;z-index:5}
.banner{position:absolute;top:48px;left:12px;max-width:min(440px,calc(100% - 24px));background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:var(--r);padding:6px 10px;font-size:11.5px;font-weight:600}
/* detail */
.dpad{padding:16px 18px;display:grid;gap:14px}
.eyebrow{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dtitle{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.015em;line-height:1.25;margin:2px 0 0;text-wrap:balance}
.dsub{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:7px 9px}
.stats .k{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stats .v{font-family:var(--f-data);font-size:14px;font-weight:500}
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t th{text-align:left;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
.tl{display:grid}
.tl .st{display:grid;grid-template-columns:44px 18px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer;align-items:start}
.tl .st:hover{background:var(--surface2)}
.tl .st.done{opacity:.55}
.tl .dot{width:12px;height:12px;border-radius:50%;margin-top:3px;border:2px solid currentColor}
.tl .dot.D{background:currentColor}
.tl .dot.num{width:20px;height:20px;margin-top:0;display:grid;place-items:center;font:600 10px var(--f-data)}
.tl .dot.num b{color:var(--ink);font-weight:600}.tl .dot.num.D b{color:#fff}
.tl .tm{font-family:var(--f-data);font-size:12px}
.tl .nm{font-weight:600;font-size:12px;min-width:0;overflow-wrap:anywhere}
.tl .ad{font-size:11px;color:var(--muted)}
.flag{display:flex;gap:8px;align-items:flex-start;font-size:11.5px}
.flag .chip{margin-top:1px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.est{border-bottom:1px dotted var(--warn);cursor:help}
.why{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:12px}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px}
.opt.best{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt.preview{outline:2px solid var(--accent)}
.opt h5{margin:0;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.opt .nums{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.opt .nums b{font-family:var(--f-data);color:var(--ink);font-weight:500}
.changes{font-size:11px;color:var(--muted);display:grid;gap:2px;max-height:140px;overflow:auto}
.note{font-size:11px;color:var(--muted)}
ul.plain{margin:0;padding-left:16px;display:grid;gap:5px}
.svgbox{overflow-x:auto}
.svgbox svg{display:block}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-items:center;z-index:20}
.overlay div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 20px;font-weight:600;display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.applied{margin:0 14px 12px;font-size:11px;color:var(--muted);display:grid;gap:3px}
.applied div{border-left:2px solid var(--accent);padding-left:8px}
.bopt{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:5px;cursor:pointer;background:var(--surface)}
.bopt:hover{border-color:var(--accent)}
.bopt.on{outline:2px solid var(--accent);border-color:var(--accent)}
.bopt .when{font-weight:700;font-size:13.5px}
.bopt .tags{display:flex;gap:4px;flex-wrap:wrap}
.bopt .disp{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:3px;padding:2px 6px;background:var(--accent-soft);color:var(--accent)}
.badge.rec{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--crit-soft);color:var(--crit)}
.phone{width:min(300px,100%);margin:0 auto;border:8px solid var(--ink);border-radius:28px;background:var(--surface2);padding:14px 12px 16px;display:grid;gap:10px}
.phone .ph-top{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-family:var(--f-data)}
.phone .job{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:10px;display:grid;gap:4px}
.phone .job.newj{animation:pulse 1.6s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-soft)}}
@media (prefers-reduced-motion: reduce){.phone .job.newj{animation:none}}
.phone .nx{background:var(--surface);border-radius:10px;padding:8px 10px;font-size:11.5px;display:grid;grid-template-columns:42px 1fr;gap:6px}
.phone .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phone .acts .btn{justify-content:center;padding:10px}
.msg{background:var(--ok-soft);color:var(--ink);border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:12.5px}
.pinbtn{white-space:nowrap}
.pinbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* responsive */
@media (max-width:1250px){.grid{grid-template-columns:300px minmax(0,1fr) 360px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:980px){
  #app{height:auto;min-height:100%}
  .grid{grid-template-columns:1fr;grid-template-rows:auto}
  .mapwrap{height:62vh;order:-1}
  .side{max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .pane{max-height:520px}
  .detail{border-left:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prod{border-left:0;padding-left:0}
}
</style>

<div id="app">
  <header class="top">
    <div class="brand"><img alt="Trans Ontario" src="__LOGO__"><div class="prod">Plan the day<small>prototype</small></div></div>
    <label class="ctl" for="day">Operating day <select id="day"></select></label>
    <button class="btn primary" id="replan" type="button">Plan the day</button>
    <div class="spacer"></div>
    <div class="status" id="status"></div>
  </header>
  <section class="kpis" id="kpis" aria-label="Plan versus actual dispatch"></section>
  <main class="grid">
    <aside class="side">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="routes" aria-selected="true" type="button">Routes</button>
        <button role="tab" data-tab="book" aria-selected="false" type="button">New order</button>
        <button role="tab" data-tab="issues" aria-selected="false" type="button">Issues<span class="count" id="icount"></span></button>
        <button role="tab" data-tab="disrupt" aria-selected="false" type="button">Disrupt</button>
        <button role="tab" data-tab="assume" aria-selected="false" type="button">Rules</button>
      </nav>
      <div class="pane" id="pane"></div>
    </aside>
    <section class="mapwrap" aria-label="Map">
      <canvas id="map"></canvas>
      <div class="maptools">
        <div class="seg" role="group" aria-label="Which plan to show">
          <button type="button" id="vPlan" aria-pressed="true">Model's plan</button>
          <button type="button" id="vAct" aria-pressed="false">Actual dispatch</button>
        </div>
        <div class="seg" role="group" aria-label="Zoom">
          <button type="button" id="fitGta">GTA</button>
          <button type="button" id="fitAll">All stops</button>
          <button type="button" id="zin" aria-label="Zoom in">+</button>
          <button type="button" id="zout" aria-label="Zoom out">−</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="banner" id="banner" hidden></div>
      <div class="timebar">
        <button class="btn small" id="play" type="button" aria-label="Play the day">▶ Play</button>
        <label for="clock" class="clock" id="clockLab">11:00</label>
        <input type="range" id="clock" min="300" max="1260" step="5" value="660">
      </div>
      <div class="tip" id="tip" hidden></div>
    </section>
    <aside class="detail" id="detail"></aside>
  </main>
  <div class="overlay" id="busy" hidden><div><span class="spin"></span><span id="busyMsg">Planning…</span></div></div>
</div>

<script>/*__DATA__*/</script>
<script>/*__ENGINE__*/</script>
<script>
(function(){
"use strict";
const DATA = window.TO_DATA, E = window.Engine, fmtT = E.fmtT, fmtN = E.fmtN;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => (n < 0 ? "−$" : "$") + fmtN(Math.abs(n));
const S = { day: null, cur: null, preview: null, scen: null, audit: null, view: "plan", tab: "routes", sel: null, t: 660, cfg: {}, applied: [], issueFilter: "all", issueScope: "plan" };
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

// ---------- colours ----------
function isDark(){ const a = document.documentElement.getAttribute("data-theme"); return a ? a === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function ucol(i){ const h = (i * 137.508 + 215) % 360; return isDark() ? `hsl(${h} 75% 64%)` : `hsl(${h} 72% 42%)`; }

// ---------- planning ----------
function busy(msg, fn){ $("#busyMsg").textContent = msg; $("#busy").hidden = false; setTimeout(() => { try { fn(); } finally { $("#busy").hidden = true; } }, 30); }
function plan(){
  const d = DATA.days[S.day];
  busy(`Planning ${d.jobs.length} stops across ${d.units.length} units…`, () => {
    const p = new E.Planner(d, DATA.depot, S.cfg);
    p.planDay(6000);

// ---------- issues ----------
function planIssues(p){
  const out = [];
  for (const u of p.unserved) { const J = p.jobs[u.g[0]]; out.push({ sev: "crit", title: `Can't plan ${J.t === "P" ? "pickup" : "delivery"} for ${J.c}`, sub: `${J.city} · ${fmtN(J.w)} lb · ${u.why.join("; ")}`, stop: J.id }); }
  for (const { r, ev, U } of routeRows(p)) {
    r.seq.forEach((j, k) => {
      const J = p.jobs[j], due = p.due(J), t = ev.times[k];
      if (t > due + 0.5) out.push({ sev: "warn", title: `${J.c} late by ${Math.round(t - due)} min`, sub: `${U.veh} · ETA ${fmtT(t)} vs promise ${fmtT(due)}${J.svc ? " (" + J.svc + ")" : ""}`, stop: j });
      else if (J.appt != null && t > J.appt - 10) out.push({ sev: "warn", title: `Tight appointment at ${J.c}`, sub: `${U.veh} · ETA ${fmtT(t)} for ${fmtT(J.appt)}`, stop: j });
    });
    const C = p.cfg.classes[U.vc];
    if (ev.end > p.cfg.softEnd + 30) out.push({ sev: "warn", title: `${U.veh} returns at ${fmtT(ev.end)}`, sub: `On-duty ${(ev.duty/60).toFixed(1)} h · overtime past ${fmtT(p.cfg.softEnd)}`, route: U.i });
    if (ev.duty > 12 * 60) out.push({ sev: "warn", title: `${U.code} ${U.name} near hours limit`, sub: `${(ev.duty/60).toFixed(1)} h on-duty of 14 h allowed`, route: U.i });
    if (ev.maxSp / C.spots > 0.93) out.push({ sev: "info", title: `${U.veh} floor ${Math.round(ev.maxSp / C.spots * 100)}% full`, sub: `Check securement and load bars before release`, route: U.i });
    const dg = r.seq.concat(r.done).filter(j => /dangerous/.test(p.jobs[j].h));
    if (dg.length) out.push({ sev: "info", title: `Dangerous goods on ${U.veh}`, sub: `${dg.length} stop(s): TDG papers and placards. Driver TDG certificate is not in the data`, route: U.i });
    for (const f of U.f || []) out.push({ sev: "info", title: `${U.veh}: ${f}`, sub: `${U.code} ${U.name} · ${U.vc === "TT" ? "tractor-trailer" : U.vc === "ST" ? "straight truck" : "van"}, licence ${U.lic}`, route: U.i });
  }
  for (const j of p.partner) { const J = p.jobs[j]; if (J.partnerHidden) continue; out.push({ sev: "info", title: `Partner carrier for ${J.c}`, sub: `${J.city}${J.prov && J.prov !== "ON" ? ", " + J.prov : ""} · ${fmtN(J.km0)} km from depot · quote ${money(J.partnerCost || p.partnerCost(J))}${J.ownCost ? " vs own truck " + money(J.ownCost) : ""}`, stop: j }); }
  // data quality — group repetitive messages
  const groups = {};
  for (const J of p.jobs) if (!J.ghost) for (const [sev, msg] of J.f || []) {
    const key = sev + "|" + msg.replace(/[\d][\d,.]*/g, "#").replace(/ from .*$/, "");
    (groups[key] = groups[key] || { sev, msg, items: [] }).items.push({ id: J.id, msg });
  }
  for (const g of Object.values(groups)) {
    if (g.items.length <= 3 || g.sev === "crit") for (const it of g.items) { const J = p.jobs[it.id]; out.push({ sev: g.sev, title: it.msg, sub: `Data · ${J.c}, ${J.city}`, stop: it.id }); }
    else out.push({ sev: g.sev, title: g.msg.replace(/ — .*/, "").replace(/[\d][\d,.]*/g, "…") + ` · ${g.items.length} stops`, sub: "Data quality · estimated values show a dotted underline", stop: g.items[0].id });
  }
  const ord = { crit: 0, warn: 1, info: 2 };
  return out.sort((a, b) => ord[a.sev] - ord[b.sev]);
}
function auditIssues(){
  const p = S.cur, out = [];
  for (const r of S.audit.routes) {
    const U = p.units[r.u];
    for (const v of r.viol) out.push({ sev: "crit", title: `${U.veh}: ${v.msg}`, sub: `Actual dispatch · ${U.code} ${U.name}${v.job != null ? " · " + p.jobs[v.job].c + ", " + p.jobs[v.job].city : ""}`, stop: v.job, actRoute: U.i });
    if (r.aLate) out.push({ sev: "warn", title: `${U.veh}: ${r.aLate} stop(s) arrived after promise`, sub: `Actual dispatch · recorded GPS arrivals vs Elite due time`, actRoute: U.i, stop: r.lateList[0] });
  }
  const ord = { crit: 0, warn: 1, info: 2 };
  return out.sort((a, b) => ord[a.sev] - ord[b.sev]);
}

function timeOpts(sel, from, to){ let h = ""; for (let m = from; m <= to; m += 30) h += `<option value="${m}" ${m === sel ? "selected" : ""}>${fmtT(m)}</option>`; return h; }

function loadStart(p, r){ const all = r.done.concat(r.seq); const set = new Set(all); return all.reduce((s, j) => { const J = p.jobs[j]; return s + (J.t === "D" && !(J.src != null && set.has(J.src)) ? J.w : 0); }, 0); }

  const a = css("--accent");
  $("#legend").innerHTML = S.view === "plan"
    ? `<span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="${css("--ink")}"/></svg>Delivery</span><span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="none" stroke="${css("--ink")}" stroke-width="2"/></svg>Pickup</span>${S.cur && S.cur.cfg.partners ? `<span><svg width="12" height="12"><path d="M6 1 L11 6 L6 11 L1 6Z" fill="none" stroke="${css("--muted")}" stroke-width="2"/></svg>Partner</span>` : ""}<span><svg width="12" height="12"><path d="M6 1 L11 6 L6 11 L1 6Z" fill="none" stroke="${css("--crit")}" stroke-width="2"/></svg>Needs decision</span><span><svg width="12" height="10"><rect x="1" y="1" width="10" height="7" rx="2" fill="${a}" stroke="${css("--ink")}"/></svg>Truck at clock time</span>`
    : `<span><svg width="20" height="8"><line x1="0" y1="4" x2="20" y2="4" stroke="${css("--ink")}" stroke-dasharray="5 4" stroke-width="1.5"/></svg>Recorded GPS order</span><span>Colours match the plan's units</span>`;
}
// map interaction
let drag = null;
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, lat: M.lat, lng: M.lng, moved: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  const b = cv.getBoundingClientRect();
  if (S.pickMode && !drag) { cv.style.cursor = "crosshair"; $("#tip").hidden = true; return; }
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; cv.classList.add("drag"); } M.lng = drag.lng - dx / kx(); M.lat = drag.lat + dy / ky(); drawMap(); return; }
  const x = e.clientX - b.left, y = e.clientY - b.top;
  const h = nearest(x, y); const tip = $("#tip");
  if (h) { const J = (S.view === "plan" ? P() : S.cur).jobs[h.j]; tip.hidden = false; tip.style.left = Math.min(W - 270, x + 12) + "px"; tip.style.top = (y + 12) + "px"; tip.innerHTML = `<b>${esc(J.c)}</b> · ${J.t === "P" ? "pickup" : J.t === "D" ? "delivery" : "transload"}<br>${esc(J.city)} · ${fmtN(J.w)} lb · ${J.sp} sp`; cv.style.cursor = "pointer"; }
  else { tip.hidden = true; cv.style.cursor = ""; }
});
cv.addEventListener("pointerup", e => { const b = cv.getBoundingClientRect(); const was = drag && drag.moved; drag = null; cv.classList.remove("drag"); if (was) return;
  if (S.pickMode) { const q = ll(e.clientX - b.left, e.clientY - b.top); const city = nearestCity(q); S.form.pins[S.pickMode] = { c: "Pinned location", a: "Pin near " + city, city, lat: +q.lat.toFixed(5), lng: +q.lng.toFixed(5) }; S.form[S.pickMode] = "pin"; S.pickMode = null; S.tab = "book"; renderPane(); drawMap(); return; }
  const h = nearest(e.clientX - b.left, e.clientY - b.top); if (h) select({ type: "stop", j: h.j }); });
cv.addEventListener("pointerleave", () => { $("#tip").hidden = true; });
cv.addEventListener("wheel", e => { e.preventDefault(); const b = cv.getBoundingClientRect(); zoomAt(e.clientX - b.left, e.clientY - b.top, e.deltaY < 0 ? 1.2 : 1 / 1.2); }, { passive: false });
function zoomAt(x, y, f){ const before = ll(x, y); M.z = Math.max(20, Math.min(6000, M.z * f)); const after = ll(x, y); M.lng += before.lng - after.lng; M.lat += before.lat - after.lat; drawMap(); }
function nearest(x, y){ let best = null, bd = 100; for (const h of HIT) { const d = (h.x - x) ** 2 + (h.y - y) ** 2; if (d < bd) { bd = d; best = h; } } return best; }
$("#fitGta").onclick = () => fit("gta"); $("#fitAll").onclick = () => fit("all");
$("#zin").onclick = () => zoomAt(W / 2, H / 2, 1.4); $("#zout").onclick = () => zoomAt(W / 2, H / 2, 1 / 1.4);
// clock
const clk = $("#clock");
function setClock(t){ S.t = t; clk.value = t; $("#clockLab").textContent = fmtT(t); drawMap(); }
clk.oninput = () => setClock(+clk.value);
let playing = null;
$("#play").onclick = () => { if (playing) { clearInterval(playing); playing = null; $("#play").textContent = "▶ Play"; return; } if (S.t >= 1250) setClock(360); $("#play").textContent = "❚❚ Pause"; playing = setInterval(() => { if (S.t >= 1260) { clearInterval(playing); playing = null; $("#play").textContent = "▶ Play"; return; } setClock(S.t + 5); }, 60); };

// ---------- boot ----------
const days = Object.keys(DATA.days).sort();
$("#day").innerHTML = days.map(d => `<option value="${d}">${new Date(d + "T12:00").toLocaleDateString("en-CA", { weekday: "short", month: "short", day: "numeric" })} · ${DATA.days[d].jobs.length} stops</option>`).join("");
S.day = store.get("to.day"); if (!DATA.days[S.day]) S.day = "2026-09-23";
$("#day").value = S.day;
const tab = store.get("to.tab"); if (["routes","book","issues","disrupt","assume"].includes(tab)) S.tab = tab;
$("#day").onchange = () => { S.day = $("#day").value; store.set("to.day", S.day); plan(); };
$("#replan").onclick = () => plan();
new ResizeObserver(resize).observe(cv);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (S.cur) renderAll(); });
new MutationObserver(() => { if (S.cur) renderAll(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
setClock(660);
resize();
plan();
})();
</script>
